<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkedIn Agent</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%233b5bfd'/><path d='M9 22V10h3v9.5h6V22z' fill='white'/><circle cx='22' cy='12' r='2.6' fill='%23a5f3c5'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<script src="static/i18n.js"></script>
<style>
:root{
  --ink:#0f1b33;--ink-2:#17264a;--ink-3:#24365f;--ink-text:#c9d3ea;--ink-muted:#8494b8;
  --paper:#f6f7fb;--surface:#ffffff;--surface-2:#fafbfe;--line:#e3e7f0;--line-2:#d2d8e6;
  --text:#101828;--muted:#5b6782;--faint:#8a95ad;
  --brand:#3b5bfd;--brand-2:#2c47d9;--brand-soft:#eef1ff;--brand-ink:#fff;
  --ok:#12a150;--ok-soft:#e7f7ee;--warn:#c97a00;--warn-soft:#fff4dc;--bad:#d4342c;--bad-soft:#fdecea;
  --r-lg:16px;--r-md:12px;--r-sm:9px;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --lift:0 1px 0 rgba(16,24,40,.04),0 8px 24px -12px rgba(16,24,40,.16);
}
[data-theme=dark]{--paper:#0c1222;--surface:#121a2e;--surface-2:#0f172a;--line:#1f2a44;--line-2:#2a3757;--text:#e7ecf6;--muted:#9aa7c3;--faint:#6f7c99;
  --brand:#6d86ff;--brand-2:#8c9fff;--brand-soft:#1a2550;--ok-soft:#0e2a1d;--warn-soft:#2c220c;--bad-soft:#331414;--lift:0 0 0 1px var(--line)}
html[dir=rtl] body{--body:"Noto Naskh Arabic","Instrument Sans",system-ui,sans-serif;--display:"Noto Naskh Arabic","Bricolage Grotesque",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--text);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{background:var(--ink);color:var(--ink-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:14px 12px;gap:4px;overflow:auto}
.ws{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--ink-2);cursor:pointer;border:1px solid transparent;width:100%;text-align:start;color:#fff}
.ws:hover{border-color:var(--ink-3)}
.ws .av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.ws small{display:block;color:var(--ink-muted);font-size:12px}
.ws svg{width:16px;height:16px;flex:none}
.ws-menu{background:var(--ink-2);border-radius:12px;padding:6px;margin-top:4px;display:none}
.ws-menu.open{display:block}
.ws-menu button{display:flex;gap:8px;align-items:center;width:100%;padding:8px;border:0;background:none;border-radius:8px;color:var(--ink-text);cursor:pointer;text-align:start}
.ws-menu button svg{width:16px;height:16px}
.ws-menu button:hover{background:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.nav .grp{font-size:12px;color:var(--ink-muted);padding:14px 12px 4px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:9px;color:var(--ink-text);font-weight:500;font-size:14.5px;text-decoration:none}
.nav a svg{width:18px;height:18px;opacity:.75;flex:none}
.nav a:hover{background:var(--ink-2);color:#fff}
.nav a.on{background:var(--brand);color:#fff}.nav a.on svg{opacity:1}
.nav a .count{margin-inline-start:auto;background:rgba(255,255,255,.16);color:#fff;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px}
.side-foot{margin-top:auto;padding:12px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-muted)}
.brandmark{display:flex;gap:9px;align-items:center;color:#fff;font:700 16px var(--display);padding:4px 8px 12px}
.brandmark i{width:28px;height:28px;border-radius:8px;background:var(--brand);display:grid;place-items:center;font-style:normal}
.brandmark i svg{width:16px;height:16px}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:12px 28px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--paper) 85%,transparent);backdrop-filter:blur(8px);position:sticky;top:0;z-index:4}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 12px;color:var(--faint);cursor:pointer}
.search svg{width:16px;height:16px}
.search kbd{margin-inline-start:auto;font:600 11px var(--body);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted)}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.iconbtn:hover{color:var(--text);border-color:var(--line-2)}
.iconbtn svg{width:18px;height:18px}
.top select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px}
.menu-btn{display:none!important}
.view{padding:28px;max-width:1240px;width:100%}
h1{font:800 30px/1.15 var(--display);letter-spacing:-.02em;margin:0}
h2{font:700 18px/1.3 var(--display);margin:0 0 4px;letter-spacing:-.01em}
h3{font:600 15px/1.35 var(--body);margin:0}
.sub{color:var(--muted);margin:6px 0 0}
.muted{color:var(--muted)}.faint{color:var(--faint);font-size:13px}
.head{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.split>*,.grid>*,.g2>*,.drawer-b>*{min-width:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.stats>div{padding:18px 20px;border-inline-start:1px solid var(--line)}.stats>div:first-child{border:0}
.stats b{display:block;font:800 30px/1.1 var(--display);letter-spacing:-.02em}
.stats span{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--faint);text-decoration:none}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand-2)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{border-color:transparent;background:none}.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:progress}
label.l{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}
input.i,select.i,textarea.i{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--text)}
textarea.i{min-height:96px;resize:vertical;line-height:1.55}
input.i:focus,select.i:focus,textarea.i:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow:auto}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--text);border-color:var(--brand)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.chip svg{width:14px;height:14px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.draft{background:var(--warn-soft);color:var(--warn)}.st.approved,.st.scheduled{background:var(--brand-soft);color:var(--brand)}
.st.published{background:var(--ok-soft);color:var(--ok)}.st.failed,.st.rejected{background:var(--bad-soft);color:var(--bad)}
.toggle{display:flex;align-items:center;gap:10px;margin:12px 0;cursor:pointer}
.toggle input{appearance:none;width:38px;height:22px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;transition:.15s;flex:none;margin:0}
.toggle input::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.toggle input:checked{background:var(--brand)}.toggle input:checked::after{inset-inline-start:19px}
/* LinkedIn preview: the signature element */
.li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;font:14px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text)}
.li-h{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.li-av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#3b5bfd,#7c4dff);color:#fff;display:grid;place-items:center;font-weight:700;flex:none;overflow:hidden}
.li-av img{width:100%;height:100%;object-fit:cover}
.li-n{font-weight:600}.li-s{font-size:12px;color:var(--muted)}
.li-t{white-space:pre-wrap;word-wrap:break-word}
.fold{position:relative;margin:4px 0;border-top:1.5px dashed var(--warn);height:0}
.fold span{position:absolute;inset-inline-end:0;top:-10px;background:var(--surface);color:var(--warn);font-size:11px;font-weight:700;padding:0 6px}
.li-media{margin-top:10px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.li-media img{display:block;width:100%}
.li-doc{display:flex;gap:10px;align-items:center;padding:12px;background:var(--surface-2);font-weight:600}.li-doc svg{width:18px;height:18px}
.li-bar{display:flex;justify-content:space-around;border-top:1px solid var(--line);margin-top:12px;padding-top:8px;color:var(--muted);font-size:13px;font-weight:600}
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow:auto;padding-bottom:6px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px;min-height:300px}
.col-h{display:flex;align-items:center;gap:8px;padding:6px 6px 10px;font-weight:700}
.col-h .n{margin-inline-start:auto;color:var(--faint);font-weight:600;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px;margin-bottom:10px;cursor:pointer;transition:border-color .12s}
.card:hover{border-color:var(--brand)}
.card p{margin:6px 0 8px;font-size:13.5px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.card .meta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--faint)}.card .meta svg{width:13px;height:13px}
.scrim{position:fixed;inset:0;background:rgba(10,16,32,.42);z-index:20;display:none}
.scrim.open{display:block}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(980px,100%);background:var(--paper);z-index:21;transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-20px 0 60px -20px rgba(0,0,0,.35)}
html[dir=rtl] .drawer{transform:translateX(-105%)}
.drawer.open{transform:none!important}
.drawer-h{display:flex;align-items:center;gap:10px;padding:16px 22px;border-bottom:1px solid var(--line);background:var(--surface)}
.drawer-b{flex:1;overflow:auto;padding:22px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-content:start}
.drawer-f{display:flex;gap:8px;align-items:center;padding:14px 22px;border-top:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.modal{position:fixed;inset:0;display:none;place-items:start center;padding-top:12vh;z-index:30;background:rgba(10,16,32,.3)}
.modal.open{display:grid}
.palette{width:min(620px,92vw);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);overflow:hidden}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:16px;background:none;outline:none}
.palette .res{max-height:50vh;overflow:auto;padding:6px}
.palette .it{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:9px;cursor:pointer}
.palette .it svg{width:16px;height:16px;color:var(--muted)}
.palette .it.on,.palette .it:hover{background:var(--brand-soft)}
.palette .it small{margin-inline-start:auto;color:var(--faint)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.cal .dh{padding:8px 10px;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface-2)}
.cal .d{min-height:118px;border-inline-end:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;position:relative;min-width:0}
.cal .d:nth-child(7n){border-inline-end:0}
.cal .d.out{background:var(--surface-2)}.cal .d.out .dn{color:var(--faint)}
.cal .d.today .dn{background:var(--brand);color:#fff}
.cal .d.over{background:var(--brand-soft)}
.cal .dn{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:7px;font-size:12.5px;font-weight:600}
.cal .ev{display:block;font-size:12px;padding:3px 7px;border-radius:6px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:grab;border-inline-start:3px solid}
.cal .ev.scheduled,.cal .ev.approved{background:var(--brand-soft);border-color:var(--brand)}
.cal .ev.published{background:var(--ok-soft);border-color:var(--ok)}.cal .ev.draft{background:var(--warn-soft);border-color:var(--warn)}
.cal .add{position:absolute;inset-inline-end:6px;top:6px;opacity:0;border:0;background:none;color:var(--brand);cursor:pointer;font-weight:700}
.cal .d:hover .add{opacity:1}
.skill{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);cursor:pointer;text-align:start;width:100%}
.skill:hover{border-color:var(--brand)}
.skill .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--brand-soft);color:var(--brand)}
.skill .ic svg{width:18px;height:18px}
.skill p{margin:3px 0 0;color:var(--muted);font-size:13px}
.out{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;font-size:14px;max-height:560px;overflow:auto}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty b{display:block;color:var(--text);font:700 17px var(--display);margin-bottom:4px}
.toast{position:fixed;bottom:22px;inset-inline-end:22px;background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-weight:500;opacity:0;transform:translateY(8px);transition:.18s;pointer-events:none;z-index:40;max-width:420px}
.toast.show{opacity:1;transform:none}
.banner{padding:11px 14px;border-radius:12px;margin-bottom:16px;font-weight:500;display:flex;gap:10px;align-items:center}
.banner svg{width:18px;height:18px;flex:none}
.banner.ok{background:var(--ok-soft);color:var(--ok)}.banner.bad{background:var(--bad-soft);color:var(--bad)}.banner.info{background:var(--brand-soft);color:var(--brand)}
.check{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);color:var(--text)}
.check:last-child{border:0}
.check i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;font-style:normal;font-size:12px;flex:none}
.check i svg{width:13px;height:13px}
.check.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.check.done span{color:var(--muted);text-decoration:line-through}
table.t{width:100%;border-collapse:collapse}table.t td,table.t th{text-align:start;padding:10px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
table.t th{font-size:12.5px;color:var(--muted);font-weight:600}
.heat{display:grid;grid-template-columns:44px repeat(8,1fr);gap:4px;font-size:11.5px}
.heat div{height:30px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:8px;height:160px;padding-top:10px}
.bars div{flex:1;background:var(--brand);border-radius:6px 6px 2px 2px;min-height:3px;position:relative}
.bars div span{position:absolute;bottom:-20px;inset-inline:0;text-align:center;font-size:11px;color:var(--faint)}
.pack{padding:18px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);display:flex;flex-direction:column;gap:10px}
.pack.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.pack .e{font-size:28px}
.drop{display:block;border:2px dashed var(--line-2);border-radius:var(--r-lg);padding:28px;text-align:center;cursor:pointer;background:var(--surface-2)}
.drop svg{width:26px;height:26px;color:var(--brand)}
.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.mtile{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.mtile .th{aspect-ratio:4/5;background:var(--surface-2);display:grid;place-items:center;overflow:hidden}
.mtile .th img{width:100%;height:100%;object-fit:cover}.mtile .th svg{width:30px;height:30px}
.mtile .b{padding:8px 10px;font-size:13px;display:flex;gap:6px;align-items:center}
.swatch{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);cursor:pointer}
.swatch.on{border-color:var(--text)}
.login{min-height:100vh;display:grid;place-items:center;background:var(--ink);padding:20px}
.login .box{width:min(400px,100%);background:var(--surface);border-radius:18px;padding:28px}
@media (max-width:1100px){.board{grid-template-columns:repeat(4,260px)}.split,.drawer-b{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){.app{grid-template-columns:1fr}.side{position:fixed;top:0;bottom:0;inset-inline-start:0;width:280px;z-index:25;transform:translateX(-105%);transition:.2s}
html[dir=rtl] .side{transform:translateX(105%)}.side.open{transform:none!important}.menu-btn{display:grid!important}.view{padding:18px}.top{padding:10px 16px}
.g3,.g4{grid-template-columns:1fr}.g2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.stats>div:nth-child(3){border:0}.search kbd,.top .btn span{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" role="status"></div>
<script>
"use strict";
const DEMO = !!window.LA_DEMO;
const $ = (s, el=document) => el.querySelector(s), $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = { get:(k,d)=>{try{return localStorage.getItem(k)??d}catch{return d}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}} };

async function api(path, opts={}){
  if (DEMO) return window.LA_MOCK(path, opts);
  const res = await fetch(path, {method: opts.method||"GET", credentials:"same-origin",
    headers: {"content-type":"application/json","x-account":ACCOUNT,"x-api-token":store.get("la_token","")},
    body: opts.body!==undefined ? JSON.stringify(opts.body) : undefined});
  if (res.status === 401 && !path.startsWith("/api/auth")) { renderLogin(); throw new Error("Sign in required"); }
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.detail || res.statusText);
  return data;
}

let SKILLS = null;
async function openPalette(){
  SKILLS = SKILLS || await api("/api/skills");
  const items = [...NAV.filter(n=>!n[0].startsWith("~")).map(n=>({label:t(n[1]),hint:"Go to",href:"#"+n[0],icon:n[2]})),
    ...SKILLS.map(s=>({label:s.title,hint:s.category,href:"#create/"+s.id,icon:CAT_IC[s.category]||"spark"}))];
  const m=$("#palette"), q=$("#pq"), res=$("#pres"); let sel=0, list=items;
  const draw=()=>{ res.innerHTML=list.slice(0,40).map((it,i)=>`<div class="it ${i===sel?"on":""}" data-i="${i}">${ic(it.icon)}${esc(it.label)}<small>${esc(it.hint)}</small></div>`).join("")||`<div class="empty">No matches</div>`;
    $$(".it",res).forEach(el=>el.onclick=()=>go(list[+el.dataset.i])); };
  const go=it=>{ if(!it) return; m.classList.remove("open"); location.hash=it.href; };
  q.value=""; draw(); m.classList.add("open"); q.focus();
  q.oninput=()=>{ const s=q.value.toLowerCase(); list=items.filter(i=>(i.label+" "+i.hint).toLowerCase().includes(s)); sel=0; draw(); };
  q.onkeydown=e=>{ if(e.key==="ArrowDown"){sel=Math.min(sel+1,list.length-1);draw();e.preventDefault()} if(e.key==="ArrowUp"){sel=Math.max(sel-1,0);draw();e.preventDefault()} if(e.key==="Enter") go(list[sel]); };
  m.onclick=e=>{ if(e.target===m) m.classList.remove("open"); };
}

function closeDrawer(){ $("#drawer")?.classList.remove("open"); $("#scrim")?.classList.remove("open"); $("#drawer")?.setAttribute("aria-hidden","true"); }
async function openPost(id){
  const p = (await api("/api/posts")).find(x=>x.id===id); if(!p) return toast("Post not found");
  const w = await who(), dr = $("#drawer"), editable = p.status !== "published";
  const local = p.scheduled_at ? new Date(new Date(p.scheduled_at).getTime() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16) : "";
  dr.innerHTML = `<div class="drawer-h"><span class="st ${p.status}">${esc(p.status)}</span><h2 style="margin:0">Post #${p.id}</h2><span class="faint">${esc(p.pillar||"")}${p.hook_type?" · "+esc(p.hook_type):""}</span><span class="sp"></span>
    ${p.url?`<a class="btn sm" href="${p.url}" target="_blank" rel="noopener">${ic("link")} View on LinkedIn</a>`:""}<button class="iconbtn" id="dx" aria-label="Close">${ic("x")}</button></div>
  <div class="drawer-b"><div>
    ${p.review_note?`<div class="banner info">${ic("bell")} Reviewer note: ${esc(p.review_note)}</div>`:""}${p.error?`<div class="banner bad">${esc(p.error)}</div>`:""}
    <label class="l" style="margin-top:0" for="ed">Post text</label><textarea class="i" id="ed" style="min-height:300px" ${editable?"":"readonly"}>${esc(p.content)}</textarea>
    <div class="row faint" style="margin-top:6px"><span id="cc"></span><span class="sp"></span><span>The first 210 characters show before “see more”.</span></div>
    <label class="l" for="fc">First comment</label><input class="i" id="fc" value="${esc(p.first_comment||"")}" ${editable?"":"readonly"}>
    <label class="l">Media</label><div class="row">${p.media?`<span class="chip">${ic(p.media.kind==="pdf"?"doc":"image")} ${esc(p.media.title||p.media.kind)}</span>${editable?`<button class="btn sm ghost" id="mrm">Remove</button>`:""}`:`<span class="faint">No media attached.</span>`}
      ${editable?`<span class="sp"></span><label class="btn sm">${ic("upload")} Upload<input type="file" id="mup" accept="image/*,application/pdf" hidden></label><button class="btn sm" id="mpick">${ic("image")} From library</button>`:""}</div>
    <div id="mlib"></div>
    ${p.metrics?`<label class="l">Metrics</label><div class="row">${["impressions","reactions","comments","reposts"].map(k=>`<span class="chip">${k} ${Number(p.metrics[k]??0).toLocaleString()}</span>`).join("")}</div>`:""}
  </div><div><label class="l" style="margin-top:0">Preview</label><div id="pv"></div></div></div>
  <div class="drawer-f">${editable?`
    ${["draft","failed"].includes(p.status)?`<button class="btn ok" data-a="approve">${ic("check")} ${t("Approve")}</button>`:`<button class="btn primary" data-a="publish">${ic("send")} ${t("Publish")} now</button>`}
    <input type="datetime-local" class="i" id="when" style="width:auto" value="${local}" aria-label="Date and time"><button class="btn" data-a="schedule">${ic("clock")} ${t("Schedule")}</button>
    <button class="btn ghost" data-a="save">${t("Save")}</button><button class="btn ghost" data-a="share">${ic("link")} Share for review</button><span class="sp"></span>
    ${["draft","failed"].includes(p.status)?`<button class="btn ghost danger" data-a="reject">${t("Reject")}</button>`:`<button class="btn ghost" data-a="unapprove">Back to draft</button>`}`
    :`<button class="btn" data-a="copy">${ic("copy")} ${t("Copy")}</button>`}</div>`;
  const ed=$("#ed"), upd=()=>{ $("#cc").textContent = `${ed.value.length.toLocaleString()} / 3,000 characters`; $("#pv").innerHTML = preview({...p, content: ed.value}, w); };
  ed.oninput = upd; upd();
  dr.classList.add("open"); $("#scrim").classList.add("open"); dr.setAttribute("aria-hidden","false");
  $("#dx").onclick = closeDrawer;
  const reload = async () => { closeDrawer(); refreshCount(); route(); };
  $("#mrm")?.addEventListener("click", async()=>{ await api(`/api/posts/${id}`,{method:"PATCH",body:{media_id:null}}); openPost(id); });
  $("#mup")?.addEventListener("change", async e => { const f=e.target.files[0]; if(!f) return; const m = await api("/api/media/upload",{method:"POST",body:{name:f.name,content:await fileToB64(f),title:f.name}}).catch(er=>toast(er.message)); if(m){ await api(`/api/posts/${id}`,{method:"PATCH",body:{media_id:m.id}}); openPost(id);} });
  $("#mpick")?.addEventListener("click", async () => { const ms = await api("/api/media"); $("#mlib").innerHTML = ms.length ? `<div class="mgrid" style="margin-top:10px">${ms.map(m=>`<button class="mtile" data-m="${m.id}" style="padding:0;cursor:pointer;text-align:start"><div class="th">${m.kind==="image"?`<img src="${esc(m.url)}" alt="">`:ic("doc")}</div><div class="b">${esc(m.title||m.kind)}</div></button>`).join("")}</div>` : `<p class="faint">Your library is empty. Create images or carousels in Media.</p>`;

  $$("[data-a]", dr).forEach(b => b.onclick = () => busy(b, async () => {
    const a = b.dataset.a, body = {content: ed.value, first_comment: $("#fc").value};
    if (a==="copy") return copy(ed.value);

    if (a==="share") { const r = await api(`/api/posts/${id}/share`,{method:"POST"}); copy(r.url); toast("Review link copied. Anyone with it can approve or ask for changes for 14 days."); return; }
    if (a==="approve") { await api(`/api/posts/${id}`,{method:"PATCH",body}); await api(`/api/posts/${id}/approve`,{method:"POST",body:{content:ed.value}}); toast("Approved"); }
    if (a==="schedule") { const v=$("#when").value; if(!v) return toast("Pick a date and time first"); await api(`/api/posts/${id}`,{method:"PATCH",body}); await api(`/api/posts/${id}/approve`,{method:"POST",body:{content:ed.value,scheduled_at:new Date(v).toISOString()}}); toast("Scheduled for "+fmt(new Date(v).toISOString())); }
    if (a==="reject") { await api(`/api/posts/${id}`,{method:"PATCH",body:{status:"rejected"}}); toast("Rejected"); }
    if (a==="unapprove") { await api(`/api/posts/${id}`,{method:"PATCH",body:{status:"draft"}}); toast("Moved back to drafts"); }
    if (a==="publish") { if(!confirm("Publish this post to LinkedIn now?")) return; const r = await api(`/api/posts/${id}/publish`,{method:"POST"}); toast("Published"); if(r.url && !DEMO) window.open(r.url,"_blank"); }
    reload();
  }));
}

views.calendar = async () => {

  posts.forEach(p => { const when = p.scheduled_at || p.published_at; if(!when) return; const k = key(new Date(when)); (by[k]=by[k]||[]).push(p); });

  $("#view").innerHTML = `<div class="head"><div><h1>${t("Calendar")}</h1><p class="sub">Drag a post to another day to move it. Subscribe from Google Calendar in Settings → Notifications & integrations.</p></div><span class="sp"></span>

  <div class="cal">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<div class="dh">${d}</div>`).join("")}
  ${days.map(d=>{ const k=key(d); return `<div class="d ${d.getMonth()!==m?"out":""} ${k===today?"today":""}" data-day="${k}"><span class="dn">${d.getDate()}</span><button class="add" data-new="${k}" title="New post">+</button>
    ${(by[k]||[]).map(p=>`<span class="ev ${p.status}" draggable="${p.status!=="published"}" data-id="${p.id}" title="${esc(p.content.slice(0,200))}">${esc(new Date(p.scheduled_at||p.published_at).toLocaleTimeString(LANG,{hour:"2-digit",minute:"2-digit"}))} ${esc(p.content.split("\n")[0])}</span>`).join("")}</div>`; }).join("")}</div>`;
  $("#cp").onclick=()=>{CAL.setMonth(CAL.getMonth()-1);route()}; $("#cn").onclick=()=>{CAL.setMonth(CAL.getMonth()+1);route()}; $("#ct").onclick=()=>{CAL=new Date();CAL.setDate(1);route()};
  $$(".ev").forEach(e=>{ e.onclick=()=>openPost(+e.dataset.id); e.ondragstart=ev=>ev.dataTransfer.setData("text/plain",e.dataset.id); });
  $$(".cal .d").forEach(c=>{ c.ondragover=e=>{e.preventDefault();c.classList.add("over")}; c.ondragleave=()=>c.classList.remove("over");
    c.ondrop=async e=>{ e.preventDefault(); c.classList.remove("over"); const id=+e.dataTransfer.getData("text/plain"); const p=posts.find(x=>x.id===id); if(!p) return;
      const old=new Date(p.scheduled_at||p.created_at), nd=new Date(c.dataset.day+"T00:00:00"); nd.setHours(old.getHours()||9, old.getMinutes());
      try { if (p.status==="draft") await api(`/api/posts/${id}`,{method:"PATCH",body:{scheduled_at:nd.toISOString()}}); else await api(`/api/posts/${id}/approve`,{method:"POST",body:{scheduled_at:nd.toISOString()}}); toast("Moved to "+fmt(nd.toISOString())); route(); } catch(er){ toast(er.message) } }; });
  $$("[data-new]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); location.hash="#create/post_writer"; });
};

views.import = async () => {

  <div class="grid g2"><section class="panel"><h2>Your LinkedIn data</h2>
    <ol class="muted" style="padding-inline-start:18px;margin:8px 0 14px"><li>On LinkedIn: Settings, Data privacy, Get a copy of your data.</li><li>Pick the larger archive (it includes your posts). LinkedIn emails it, usually within a day.</li><li>Drop the ZIP here.</li></ol>
    <label class="drop" id="d1">${ic("upload")}<br><b>Drop the ZIP or CSV files</b><br><span class="faint">Profile, Positions, Skills, Education, Shares</span><input type="file" id="f1" accept=".zip,.csv" multiple hidden></label>
    <div id="r1"></div></section>
  <section class="panel"><h2>Post analytics</h2>
    <ol class="muted" style="padding-inline-start:18px;margin:8px 0 14px"><li>On LinkedIn: Me, Posts & activity, Analytics.</li><li>Click Export and download the XLSX.</li><li>Drop it here. Metrics attach to matching posts.</li></ol>

    <div id="r2"></div></section></div>`;
  const wire = (drop, input, url, out, multi) => {
    const send = async files => { $(out).innerHTML = `<p class="faint">Reading…</p>`;
      try { const payload = multi ? {files: await Promise.all([...files].map(async f=>({name:f.name, content:await fileToB64(f)})))} : {name:files[0].name, content:await fileToB64(files[0])};

  };
  wire("#d1","#f1","/api/import/linkedin","#r1",true); wire("#d2","#f2","/api/import/analytics","#r2",false);
};

    $("#wf").onsubmit=e=>{e.preventDefault();busy(e.submitter,async()=>{await api("/api/accounts",{method:"POST",body:Object.fromEntries(new FormData(e.target))});shell()})};
    $$("[data-ren]").forEach(b=>b.onclick=async()=>{const n=prompt("New name");if(n){await api("/api/accounts/"+b.dataset.ren,{method:"PATCH",body:{name:n}});shell()}});
    $$("[data-rm]").forEach(b=>b.onclick=async()=>{if(confirm("Delete this workspace with all its posts? This can't be undone.")){await api("/api/accounts/"+b.dataset.rm,{method:"DELETE"});ACCOUNT="1";store.set("la_account","1");shell()}});
  }
  if (tab==="team"){ let tm; try { tm = await api("/api/team"); } catch(e){ tm = {users:[],roles:["admin","editor","reviewer"]}; }
    box.innerHTML = `<div class="split"><section class="panel"><h2>Team</h2>${tm.users.length?`<table class="t"><tr><th>Name</th><th>Role</th><th></th></tr>${tm.users.map(u=>`<tr><td><b>${esc(u.name)}</b><div class="faint">${esc(u.email)}</div></td>
      <td><select class="i" data-role="${u.id}" style="width:auto">${tm.roles.map(r=>`<option ${r===u.role?"selected":""}>${r}</option>`).join("")}</select></td><td style="text-align:end"><button class="btn sm ghost danger" data-urm="${u.id}">Remove</button></td></tr>`).join("")}</table>`
      :`<div class="empty"><b>Single-user mode</b>Create an admin account to turn on sign-in. After that, everyone signs in with their own account.</div>`}
      <p class="faint" style="margin-top:12px"><b>Admin</b> can do everything. <b>Editor</b> writes and edits drafts. <b>Reviewer</b> approves, schedules and publishes.</p></section>
      <form class="panel" id="tf" style="align-self:start"><h2>${tm.users.length?"Add a teammate":"Create the admin account"}</h2><label class="l">Name</label><input class="i" name="name" required><label class="l">Email</label><input class="i" name="email" type="email" required>
      <label class="l">${tm.users.length?"Temporary password":"Password"}</label><input class="i" name="password" type="password" minlength="8" required>${tm.users.length?`<label class="l">Role</label><select class="i" name="role">${tm.roles.map(r=>`<option>${r}</option>`).join("")}</select>`:""}
      <button class="btn primary" style="margin-top:14px">${tm.users.length?"Add teammate":"Create admin and sign in"}</button></form></div>`;
    $("#tf").onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));busy(e.submitter,async()=>{ if(!tm.users.length){ await api("/api/auth/setup",{method:"POST",body:d}); location.reload(); } else { await api("/api/team",{method:"POST",body:d}); toast("Added. Share their email and temporary password with them."); route(); } })};
    $$("[data-role]").forEach(s=>s.onchange=async()=>{await api("/api/team/"+s.dataset.role,{method:"PATCH",body:{role:s.value}});toast("Role updated")});
    $$("[data-urm]").forEach(b=>b.onclick=()=>busy(b,async()=>{await api("/api/team/"+b.dataset.urm,{method:"DELETE"});route()}));
  }
  if (tab==="desktop"){
    box.innerHTML = `<div class="grid g2"><section class="panel"><h2>Use it from Claude, Cursor or any AI agent</h2><p class="faint">Add this to your MCP client config. In Claude Code: <code>claude mcp add linkedin-agent -- linkedin-agent mcp</code></p>
      <div class="out">{"mcpServers":{"linkedin-agent":{"command":"linkedin-agent","args":["mcp"]}}}</div></section>
      <section class="panel"><h2>Claude skill</h2><p class="faint">One skill with every LinkedIn playbook. Upload the ZIP in Claude: Settings, Capabilities, Skills.</p><a class="btn" href="https://jrnoorbaloch.github.io/linkedin-agent/downloads/linkedin-agent-skill.zip">${ic("download")} Download the skill</a></section></div>`;
  }
};

shell();
</script>
</body>
</html>
