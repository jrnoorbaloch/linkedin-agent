[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-agent"
version = "0.1.0"
description = "Self-hosted, bring-your-own-LLM LinkedIn agent: daily posts, profile optimization, resumes and approval-gated publishing via LinkedIn's official API. Ships with a web portal, an MCP server and a Claude skill."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["linkedin", "ai-agent", "llm", "mcp", "claude-skill", "linkedin-automation", "personal-branding", "resume-builder", "content-scheduler"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Framework :: FastAPI",
  "Topic :: Office/Business",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "apscheduler>=3.10,<4",
  "cryptography>=42",
  "python-docx>=1.1",
  "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
linkedin-agent = "linkedin_agent.cli:main"

[project.urls]
Homepage = "https://jrnoorbaloch.github.io/linkedin-agent/"
Documentation = "https://jrnoorbaloch.github.io/linkedin-agent/"
Repository = "https://github.com/jrnoorbaloch/linkedin-agent"

[tool.setuptools.packages.find]
include = ["linkedin_agent*"]

[tool.setuptools.package-data]
linkedin_agent = ["static/*"]
